{% extends "base.html" %}
{% block title %}{{ resume.title }} · ResumeAI{% endblock %}
{% block content %}
<div class="editor-shell">
  <section class="editor-pane" aria-label="Resume editor">
    <div class="editor-toolbar">
      <div class="row" style="gap:8px">
        <a class="icon-btn" href="{{ url_for('resumes.dashboard') }}" title="Back to my resumes" aria-label="Back">←</a>
        <input class="title-input" id="title" type="text" value="{{ resume.title }}" maxlength="100" aria-label="Resume name">
        <span class="save-state" id="save-state">Saved</span>
      </div>
      <div class="row" style="gap:8px">
        <label for="template" style="margin:0">Template</label>
        <select id="template" style="width:auto">
          {% for key, t in templates.items() %}<option value="{{ key }}" {{ 'selected' if key == resume.template }}>{{ t.name }}</option>{% endfor %}
        </select>
        <span class="spacer"></span>
        <span class="badge badge-ai" title="AI provider">AI: {{ ai_provider() }}</span>
        <a class="btn btn-primary btn-sm" id="pdf-btn" href="{{ url_for('resumes.pdf', resume_id=resume.id) }}">⬇ Download PDF</a>
      </div>
    </div>
    <div class="editor-body" id="editor"></div>
  </section>
  <section class="preview-pane" id="preview-pane" aria-label="Live preview">
    <iframe class="preview-frame" id="preview" title="Resume preview"
            src="{{ url_for('resumes.preview', resume_id=resume.id) }}"></iframe>
  </section>
</div>
<script type="application/json" id="resume-json">{{ {"id": resume.id, "title": resume.title, "template": resume.template, "data": resume.data, "previewUrl": url_for('resumes.preview', resume_id=resume.id), "apiUrl": url_for('resumes.api_save', resume_id=resume.id), "aiUrl": url_for('ai.suggest')}|tojson }}</script>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/editor.js') }}"></script>{% endblock %}
