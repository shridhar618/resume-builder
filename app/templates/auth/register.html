{% extends "base.html" %}
{% block title %}Create account · ResumeAI{% endblock %}
{% block content %}
<main class="auth-wrap">
  <div class="card auth-card">
    <h1>Create your account</h1>
    <p class="muted">Your resumes are private to your account.</p>
    <form method="post" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" value="{{ form.name }}" required maxlength="100" autocomplete="name">
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ form.email }}" required autocomplete="email">
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
        <div class="hint">At least 8 characters, with a letter and a number.</div>
      </div>
      <div>
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password">
      </div>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>
    <hr class="divider">
    <p class="small muted">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
  </div>
</main>
{% endblock %}
